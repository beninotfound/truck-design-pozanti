{% extends "admin_base.html" %}
{% block title %}Ürünü Düzenle{% endblock %}
{% block admin_content %}
<h2>Ürünü Düzenle</h2>
{% if product.image %}
  <img src="{{ url_for('static', filename='uploads/' ~ product.image) }}" class="edit-preview">
{% endif %}
<form method="POST" enctype="multipart/form-data" class="admin-form form-card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label>Stok Kodu</label>
  <input type="text" name="stok_kodu" required maxlength="50" value="{{ product.stok_kodu }}">

  <label>Ürün Adı</label>
  <input type="text" name="ad" required maxlength="200" value="{{ product.ad }}">

  <label>Adet (Stok Miktarı)</label>
  <input type="number" name="adet" min="0" step="1" required value="{{ product.adet }}">

  <label>Geliş Fiyatı (₺)</label>
  <input type="number" name="gelis_fiyati" min="0" step="0.01" required value="{{ product.gelis_fiyati }}">

  <label>Satış Fiyatı - KDV Hariç (₺)</label>
  <input type="number" name="satis_fiyati" min="0" step="0.01" required value="{{ product.satis_fiyati }}">

  <label>KDV Oranı (%)</label>
  <input type="number" name="kdv_orani" min="0" step="0.01" value="{{ product.kdv_orani }}">

  <label>Yeni Fotoğraf (opsiyonel - boş bırakılırsa mevcut görsel korunur)</label>
  <input type="file" name="image" accept=".jpg,.jpeg,.png,.webp">

  <button type="submit" class="btn btn-accent">Güncelle</button>
</form>
{% endblock %}
